<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Gemini Laptop Test</title>
</head>
<body>
  <h2>Gemini 노트북 인식 테스트</h2>
  <div>
    <label>API Key: <input type="text" id="apiKey" placeholder="Gemini API Key 입력" style="width: 300px;"></label>
  </div><br>
  <div>
    <label>노트북 사진 촬영/업로드: <input type="file" id="imageInput" accept="image/*" capture="environment"></label>
  </div><br>
  <button onclick="testLaptop()" style="padding: 8px 16px;">테스트 실행</button>
  <h3>결과:</h3>
  <pre id="result" style="background: #eee; padding: 10px;">대기 중...</pre>

  <script>
    async function testLaptop() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const fileInput = document.getElementById('imageInput').files[0];
      const resultEl = document.getElementById('result');

      if (!apiKey || !fileInput) {
        alert('API Key와 이미지를 모두 입력해주세요.');
        return;
      }

      resultEl.innerText = '분석 중...';

      const reader = new FileReader();
      reader.readAsDataURL(fileInput);
      reader.onload = async () => {
        const base64Data = reader.result.split(',')[1];
        try {
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: "이 사진 속 물건이 노트북(Laptop)인지 판단해줘. 첫 줄에 YES 또는 NO, 둘째 줄에 이유를 간단히 적어줘." },
                  { inline_data: { mime_type: fileInput.type, data: base64Data } }
                ]
              }]
            })
          });
          const data = await res.json();
          if (data.candidates && data.candidates[0].content.parts[0].text) {
            resultEl.innerText = data.candidates[0].content.parts[0].text;
          } else {
            resultEl.innerText = '응답 오류: ' + JSON.stringify(data);
          }
        } catch (err) {
          resultEl.innerText = '네트워크 오류: ' + err.message;
        }
      };
    }
  </script>
</body>
</html>
