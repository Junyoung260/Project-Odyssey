<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Odysseus</title>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f4f4f9; max-width: 800px; margin: 0 auto; }
  .hidden { display: none !important; }
  #intro, #resultPopup { text-align: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 1000; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .art { font-family: monospace; white-space: pre; margin: 20px 0; font-size: 1.2em; line-height: 1.2; }
  
  .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  nav { display: flex; gap: 5px; flex: 1; margin-right: 10px; }
  nav button { flex: 1; padding: 10px; cursor: pointer; }
  .edit-lock-btn { padding: 10px 15px; background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 4px; cursor: pointer; font-weight: bold; }
  .edit-lock-btn.unlocked { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }

  .header-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  button { cursor: pointer; padding: 6px 12px; }
  
  .task-list { list-style: none; padding: 0; }
  .task-item { display: flex; align-items: center; justify-content: space-between; background: white; padding: 10px; margin-bottom: 6px; border-radius: 6px; border: 1px solid #ccc; }
  .task-info { flex: 1; margin: 0 10px; }
  .task-title { font-weight: bold; }
  .task-criteria { font-size: 0.8em; color: #666; }
  .completed { text-decoration: line-through; color: gray; }
  .task-form { background: white; padding: 15px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 20px; }
  .task-form input, .task-form select { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }

  .weekly-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
  .week-day-card { background: white; padding: 10px; border-radius: 6px; border: 1px solid #ccc; min-height: 200px; display: flex; flex-direction: column; }
  .week-day-header { font-weight: bold; text-align: center; margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid #eee; font-size: 0.9em; }
  .week-day-tasks { flex: 1; font-size: 0.85em; }
  .week-task-item { margin-bottom: 4px; padding: 4px; background: #f9f9f9; border-radius: 3px; border: 1px solid #eee; display: flex; align-items: center; gap: 4px; }
  .week-task-item.done { text-decoration: line-through; color: #888; background: #e9f7ef; }

  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .calendar-weekday { text-align: center; font-weight: bold; padding: 5px; background: #e2e8f0; border-radius: 4px; font-size: 0.9em; }
  .calendar-cell { background: white; min-height: 90px; padding: 6px; border-radius: 4px; border: 1px solid #ccc; display: flex; flex-direction: column; cursor: pointer; transition: background 0.2s; }
  .calendar-cell:hover { background: #f1f5f9; }
  .calendar-cell.empty { background: transparent; border: none; cursor: default; }
  .calendar-date-num { font-weight: bold; font-size: 0.85em; margin-bottom: 4px; }
  .calendar-tasks-preview { font-size: 0.75em; overflow: hidden; display: flex; flex-direction: column; gap: 2px; }
  .cal-task-badge { padding: 2px 4px; border-radius: 2px; background: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-task-badge.done { background: #d1fae5; color: #065f46; text-decoration: line-through; }

  .settings-card { background: white; padding: 20px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 15px; }
  .settings-card label { display: block; font-weight: bold; margin-bottom: 5px; margin-top: 10px; font-size: 0.9em; }
  .settings-card input { width: 100%; padding: 8px; box-sizing: border-box; margin-bottom: 10px; }
  .locked-notice { background: #fff3cd; color: #856404; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 0.9em; border: 1px solid #ffeeba; }
  
  .life-status-box { background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
  #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; font-size: 1.2em; }
</style>
</head>
<body>

<!-- 인트로 화면 -->
<div id="intro">
  <h1>Project Odysseus</h1>
  <div class="art">
      |
    --+--
      |
    ~ ^ ~ ^ ~
  </div>
  <p>유혹을 이겨내고 이타카로 향하세요.</p>
  <button id="startBtn" style="padding: 15px 30px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 5px;">Start</button>
</div>

<!-- 자정 결과 팝업 화면 (초기 숨김) -->
<div id="resultPopup" class="hidden">
  <h2 id="resultPopupTitle">어제의 항해 결과</h2>
  <div class="art" id="resultPopupArt"></div>
  <p id="resultPopupDesc" style="margin: 15px 0; font-weight: bold;"></p>
  <button onclick="closeResultPopup()" style="padding: 12px 24px; background: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px;">확인</button>
</div>

<div id="mainApp" class="hidden">
  <div class="app-header">
    <nav>
      <button onclick="switchView('monthly')">월간</button>
      <button onclick="switchView('weekly')">주간</button>
      <button onclick="switchView('daily')">일간</button>
      <button onclick="switchView('settings')">설정</button>
    </nav>
    <button id="editLockBtn" class="edit-lock-btn" onclick="toggleEditMode()" title="수정 권한 잠금/해제">✏️ 잠김</button>
  </div>
  <main id="appContent"></main>
</div>

<div id="loadingOverlay" class="hidden">
  <p id="loadingText">AI가 이미지를 판별 중입니다...</p>
</div>

<input type="file" id="aiImageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">

<script>
  let db;
  const dbName = "OdysseusDB";
  let currentDate = new Date().toISOString().split('T')[0];
  let currentWeekStart = getMonday(new Date());
  let currentMonthDate = new Date();
  let isUnlocked = false;
  let currentView = 'daily';
  let activeTaskIdForAI = null;
  let isRunningRecoveryMode = false;

  function initDB() {
    const request = indexedDB.open(dbName, 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('tasks')) db.createObjectStore('tasks', { keyPath: 'id', autoIncrement: true });
      if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
    };
    request.onsuccess = (e) => { 
      db = e.target.result; 
      loadRemainingLives();
      checkMidnightEvaluation(); // 자정 결과 평가 체크 실행
    };
    request.onerror = (e) => console.error("IndexedDB error:", e);
  }

  let remainingLives = 3;
  function loadRemainingLives() {
    getStoredSetting('remainingLives', (val) => {
      if (val !== null) remainingLives = parseInt(val, 10);
      else saveRemainingLives(3);
    });
  }
  function saveRemainingLives(count) {
    remainingLives = count;
    const transaction = db.transaction(['settings'], 'readwrite');
    transaction.objectStore('settings').put({ key: 'remainingLives', value: String(count) });
  }

  // --- 자정(00:00) 이후 전날 평가 및 팝업 기믹 로직 ---
  function checkMidnightEvaluation() {
    const todayStr = new Date().toISOString().split('T')[0];
    getStoredSetting('lastCheckedDate', (lastDate) => {
      if (!lastDate) {
        // 최초 실행 시 오늘 날짜 기록 후 패스
        saveSettingDirect('lastCheckedDate', todayStr);
        return;
      }

      if (lastDate !== todayStr) {
        // 날짜가 바뀌었으므로 전날(lastDate) 결과 정산
        evaluateDayResult(lastDate, () => {
          saveSettingDirect('lastCheckedDate', todayStr);
        });
      }
    });
  }

  function evaluateDayResult(targetDateStr, callback) {
    const transaction = db.transaction(['tasks'], 'readonly');
    transaction.objectStore('tasks').getAll().onsuccess = (e) => {
      const allTasks = e.target.result;
      const dayTasks = allTasks.filter(t => t.date === targetDateStr);

      let title = "";
      let art = "";
      let desc = "";

      if (dayTasks.length > 0) {
        const allCompleted = dayTasks.every(t => t.completed);
        if (allCompleted) {
          title = "항해 성공";
          art = "     |    \n   --+--  \n     |    \n ~ ^ ~ ^ ~";
          desc = `오디세우스는 ${targetDateStr} 유혹을 무사히 견뎌냈습니다.`;
        } else {
          title = "항해 실패";
          art = "    \\ o / \n     \\|/  \n     / \\  \n ~ ~ ~ ~ ~";
          desc = `오디세우스는 ${targetDateStr} 유혹을 참지 못하고 세이렌을 향해 헤엄쳤습니다.`;
          
          // 실패 시 라이프 차감
          remainingLives = Math.max(0, remainingLives - 1);
          saveRemainingLives(remainingLives);

          if (remainingLives === 0) {
            triggerPenaltyEmail();
          }
        }
      } else {
        // 등록된 계획이 없으면 패스 또는 기본 성공 처리
        if (callback) callback();
        return;
      }

      // 월말 완료(이타카 귀향) 조건 예시: 매월 말일 체크 등 추가 가능
      showResultPopup(title, art, desc);
      if (callback) callback();
    };
  }

  function showResultPopup(title, art, desc) {
    document.getElementById('resultPopupTitle').innerText = title;
    document.getElementById('resultPopupArt').innerText = art;
    document.getElementById('resultPopupDesc').innerText = desc;
    document.getElementById('resultPopup').classList.remove('hidden');
  }

  function closeResultPopup() {
    document.getElementById('resultPopup').classList.add('hidden');
  }

  function saveSettingDirect(key, value) {
    if (!db) return;
    const transaction = db.transaction(['settings'], 'readwrite');
    transaction.objectStore('settings').put({ key: key, value: value });
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('intro').classList.add('hidden');
    document.getElementById('mainApp').classList.remove('hidden');
    switchView('daily');
  });

  function switchView(viewName) {
    currentView = viewName;
    const content = document.getElementById('appContent');
    if (viewName === 'daily') renderDailyView(content);
    else if (viewName === 'weekly') renderWeeklyView(content);
    else if (viewName === 'monthly') renderMonthlyView(content);
    else if (viewName === 'settings') renderSettingsView(content);
  }

  function toggleEditMode() {
    if (isUnlocked) {
      isUnlocked = false;
      updateEditLockButtonUI();
      alert("수정 권한이 잠겼습니다.");
      switchView(currentView);
    } else {
      getStoredSetting('password', (savedPw) => {
        if (!savedPw) {
          if (confirm("설정된 비밀번호가 없습니다. 설정 화면으로 이동하여 설정해주세요. 잠금을 해제하시겠습니까?")) {
            isUnlocked = true;
            updateEditLockButtonUI();
            switchView(currentView);
          }
          return;
        }
        const inputPw = prompt("수정 권한을 얻으려면 비밀번호를 입력하세요:");
        if (inputPw === savedPw) {
          isUnlocked = true;
          updateEditLockButtonUI();
          alert("수정 권한이 인증되었습니다.");
          switchView(currentView);
        } else if (inputPw !== null) {
          alert("비밀번호가 일치하지 않습니다.");
        }
      });
    }
  }

  function updateEditLockButtonUI() {
    const btn = document.getElementById('editLockBtn');
    if (isUnlocked) {
      btn.innerText = "🔓 수정 완료(잠금)";
      btn.classList.add('unlocked');
    } else {
      btn.innerText = "✏️ 잠김";
      btn.classList.remove('unlocked');
    }
  }

  function getStoredSetting(key, callback) {
    if (!db) { callback(null); return; }
    const transaction = db.transaction(['settings'], 'readonly');
    const store = transaction.objectStore('settings');
    const req = store.get(key);
    req.onsuccess = (e) => {
      const result = e.target.result;
      callback(result ? result.value : null);
    };
    req.onerror = () => callback(null);
  }

  function getMonday(d) {
    d = new Date(d);
    let day = d.getDay(), diff = d.getDate() - day + (day === 0 ? -6 : 1);
    return new Date(d.setDate(diff));
  }

  function formatDateStr(d) {
    return d.toISOString().split('T')[0];
  }

  function startRunningRecovery() {
    getStoredSetting('geminiKey', (apiKey) => {
      if (!apiKey) {
        alert("Gemini API Key가 설정되어 있지 않습니다.");
        switchView('settings');
        return;
      }
      if (remainingLives >= 3) {
        alert("기회가 가득 차 있습니다. (3/3)");
        return;
      }
      isRunningRecoveryMode = true;
      document.getElementById('aiImageInput').click();
    });
  }

  function triggerPenaltyEmail() {
    getStoredSetting('emailService', (serviceId) => {
      getStoredSetting('emailTemplate', (templateId) => {
        getStoredSetting('emailPublic', (publicKey) => {
          getStoredSetting('targetEmail', (targetEmail) => {
            if (!serviceId || !templateId || !publicKey || !targetEmail) return;
            emailjs.init(publicKey);
            emailjs.send(serviceId, templateId, {
              to_email: targetEmail,
              message: "오디세우스 프로젝트 실패 횟수 초과로 페널티(커피)가 발생했습니다!"
            });
          });
        });
      });
    });
  }

  function handleImageUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (isRunningRecoveryMode) {
      isRunningRecoveryMode = false;
      event.target.value = '';
      getStoredSetting('geminiKey', async (apiKey) => {
        document.getElementById('loadingText').innerText = "러닝 기록 판별 중...";
        document.getElementById('loadingOverlay').classList.remove('hidden');
        try {
          const base64Data = await fileToBase64(file);
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: "10km 러닝 완주 증명 사진인지 판단. 첫 줄에 PASS 또는 FAIL 출력." }, { inline_data: { mime_type: file.type, data: base64Data } }] }] })
          });
          const data = await response.json();
          document.getElementById('loadingOverlay').classList.add('hidden');
          if (data.candidates && data.candidates[0].content.parts[0].text.toUpperCase().includes('PASS')) {
            saveRemainingLives(Math.min(3, remainingLives + 1));
            alert("러닝 복구 성공!");
            if (currentView === 'daily') renderDailyView(document.getElementById('appContent'));
          } else {
            alert("러닝 인증 실패");
          }
        } catch (err) {
          document.getElementById('loadingOverlay').classList.add('hidden');
          alert("오류 발생");
        }
      });
      return;
    }

    if (!activeTaskIdForAI) return;
    const taskId = activeTaskIdForAI;
    activeTaskIdForAI = null;
    event.target.value = '';

    db.transaction(['tasks'], 'readonly').objectStore('tasks').get(taskId).onsuccess = (e) => {
      const task = e.target.result;
      if (!task) return;
      getStoredSetting('geminiKey', async (apiKey) => {
        document.getElementById('loadingText').innerText = "이미지 판별 중...";
        document.getElementById('loadingOverlay').classList.remove('hidden');
        try {
          const base64Data = await fileToBase64(file);
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: `[제목: ${task.title}] [기준: ${task.criteria}] 부합 여부 판별. 첫 줄에 PASS 또는 FAIL 출력.` }, { inline_data: { mime_type: file.type, data: base64Data } }] }] })
          });
          const data = await response.json();
          document.getElementById('loadingOverlay').classList.add('hidden');
          if (data.candidates && data.candidates[0].content.parts[0].text.toUpperCase().includes('PASS')) {
            alert("인증 성공");
            updateTaskStatus(taskId, true);
          } else {
            alert("인증 실패");
          }
        } catch (err) {
          document.getElementById('loadingOverlay').classList.add('hidden');
          alert("오류 발생");
        }
      });
    };
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });
  }

  function handleTaskVerification(task) {
    if (task.completed) {
      if (confirm("해제하시겠습니까?")) updateTaskStatus(task.id, false);
      return;
    }
    if (task.type === 'simple') updateTaskStatus(task.id, true);
    else if (task.type === 'location') verifyLocation(task);
    else if (task.type === 'ai') verifyAIImage(task);
  }

  function verifyLocation(task) {
    if (!navigator.geolocation) { alert("위치 미지원"); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => { alert("위치 인증 성공"); updateTaskStatus(task.id, true); },
      (err) => { alert("위치 실패: " + err.message); }
    );
  }

  function verifyAIImage(task) {
    getStoredSetting('geminiKey', (apiKey) => {
      if (!apiKey) { alert("API Key 필요"); switchView('settings'); return; }
      activeTaskIdForAI = task.id;
      document.getElementById('aiImageInput').click();
    });
  }

  function updateTaskStatus(id, status) {
    const transaction = db.transaction(['tasks'], 'readwrite');
    const store = transaction.objectStore('tasks');
    store.get(id).onsuccess = (e) => {
      let task = e.target.result;
      if (task) {
        task.completed = status;
        store.put(task);
        if (currentView === 'daily') loadTasksForCurrentDate();
        else if (currentView === 'weekly') loadTasksForWeeklyView(currentWeekStart);
        else if (currentView === 'monthly') renderMonthlyView(document.getElementById('appContent'));
      }
    };
  }

  function renderDailyView(container) {
    let formHtml = isUnlocked ? `
      <div class="task-form">
        <h3>새 계획 추가 (${currentDate})</h3>
        <input type="text" id="taskTitle" placeholder="계획 제목">
        <select id="taskType" onchange="toggleCriteriaInput(this.value)">
          <option value="simple">단순 체크</option>
          <option value="location">위치 인증</option>
          <option value="ai">AI 이미지 인증</option>
        </select>
        <input type="text" id="taskCriteria" class="hidden" placeholder="인증 기준 입력">
        <button onclick="addNewTask()" style="width: 100%; background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px;">추가하기</button>
      </div>
    ` : `<div class="locked-notice">🔒 잠금 상태입니다.</div>`;

    container.innerHTML = `
      <div class="life-status-box">
        <div>❤️ 남은 기회: <strong>${remainingLives} / 3</strong></div>
        <button onclick="startRunningRecovery()" style="background:#17a2b8; color:white; border:none; padding:6px 12px; border-radius:4px; font-weight:bold;">🏃‍♂️ 10km 복구</button>
      </div>
      <div class="header-controls">
        <button onclick="changeDailyDate(-1)">&lt; 이전</button>
        <input type="date" id="selectedDateInput" value="${currentDate}" onchange="onDateChange(this.value)">
        <button onclick="changeDailyDate(1)">다음 &gt;</button>
      </div>
      ${formHtml}
      <div id="taskListContainer"></div>
    `;
    loadTasksForCurrentDate();
  }

  function toggleCriteriaInput(type) {
    const criteriaInput = document.getElementById('taskCriteria');
    if (!criteriaInput) return;
    if (type === 'simple') criteriaInput.classList.add('hidden');
    else criteriaInput.classList.remove('hidden');
  }

  function changeDailyDate(days) {
    let d = new Date(currentDate);
    d.setDate(d.getDate() + days);
    currentDate = formatDateStr(d);
    const input = document.getElementById('selectedDateInput');
    if (input) input.value = currentDate;
    loadTasksForCurrentDate();
  }

  function onDateChange(val) { currentDate = val; loadTasksForCurrentDate(); }

  function loadTasksForCurrentDate() {
    if (!db) return;
    db.transaction(['tasks'], 'readonly').objectStore('tasks').getAll().onsuccess = (e) => {
      const allTasks = e.target.result;
      const filtered = allTasks.filter(t => t.date === currentDate).sort((a, b) => (a.order || 0) - (b.order || 0));
      const listContainer = document.getElementById('taskListContainer');
      if (!listContainer) return;

      if (filtered.length === 0) {
        listContainer.innerHTML = `<p style="text-align: center; color: #777;">계획 없음</p>`;
        return;
      }

      let html = `<ul class="task-list">`;
      filtered.forEach((task, index) => {
        let actionButtons = isUnlocked ? `
          <div style="display:flex; gap:4px;">
            <button onclick="moveTask(${task.id}, 'up')" ${index === 0 ? 'disabled' : ''}>▲</button>
            <button onclick="moveTask(${task.id}, 'down')" ${index === filtered.length - 1 ? 'disabled' : ''}>▼</button>
            <button onclick="deleteTask(${task.id})" style="background: #dc3545; color: white; border: none;">삭제</button>
          </div>
        ` : '';

        html += `
          <li class="task-item">
            <button onclick="handleTaskVerification({id: ${task.id}, type: '${task.type}', completed: ${task.completed}})" style="background: ${task.completed ? '#6c757d' : '#007bff'}; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold;">${task.completed ? '✔ 완료' : '미완료'}</button>
            <div class="task-info">
              <div class="task-title ${task.completed ? 'completed' : ''}">${escapeHtml(task.title)}</div>
              <div class="task-criteria">방식: ${task.type} ${task.criteria ? `| 기준: ${escapeHtml(task.criteria)}` : ''}</div>
            </div>
            ${actionButtons}
          </li>
        `;
      });
      html += `</ul>`;
      listContainer.innerHTML = html;
    };
  }

  function addNewTask() {
    if (!isUnlocked) return;
    const title = document.getElementById('taskTitle').value.trim();
    const type = document.getElementById('taskType').value;
    const criteria = document.getElementById('taskCriteria').value.trim();
    if (!title) return;

    const transaction = db.transaction(['tasks'], 'readwrite');
    const store = transaction.objectStore('tasks');
    store.getAll().onsuccess = (e) => {
      const tasks = e.target.result.filter(t => t.date === currentDate);
      const maxOrder = tasks.length > 0 ? Math.max(...tasks.map(t => t.order || 0)) : -1;
      store.add({ title, type, criteria, date: currentDate, completed: false, order: maxOrder + 1 })
        .onsuccess = () => loadTasksForCurrentDate();
    };
  }

  function deleteTask(id) {
    if (!isUnlocked) return;
    if (!confirm("삭제하시겠습니까?")) return;
    db.transaction(['tasks'], 'readwrite').objectStore('tasks').delete(id).onsuccess = () => loadTasksForCurrentDate();
  }

  function moveTask(id, direction) {
    if (!isUnlocked) return;
    const transaction = db.transaction(['tasks'], 'readwrite');
    const store = transaction.objectStore('tasks');
    store.getAll().onsuccess = (e) => {
      const tasks = e.target.result.filter(t => t.date === currentDate).sort((a, b) => (a.order || 0) - (b.order || 0));
      const idx = tasks.findIndex(t => t.id === id);
      if (idx === -1) return;
      const targetIdx = direction === 'up' ? idx - 1 : idx + 1;
      if (targetIdx < 0 || targetIdx >= tasks.length) return;

      const tempOrder = tasks[idx].order;
      tasks[idx].order = tasks[targetIdx].order;
      tasks[targetIdx].order = tempOrder;
      store.put(tasks[idx]);
      store.put(tasks[targetIdx]);
      transaction.oncomplete = () => loadTasksForCurrentDate();
    };
  }

  function renderWeeklyView(container) {
    let startOfWeek = new Date(currentWeekStart);
    let endOfWeek = new Date(startOfWeek);
    endOfWeek.setDate(endOfWeek.getDate() + 6);
    container.innerHTML = `
      <div class="header-controls">
        <button onclick="changeWeek(-1)">&lt; 이전</button>
        <span style="font-weight:bold;">${formatDateStr(startOfWeek)} ~ ${formatDateStr(endOfWeek)}</span>
        <button onclick="changeWeek(1)">다음 &gt;</button>
      </div>
      <div class="weekly-container" id="weeklyGrid"></div>
    `;
    loadTasksForWeeklyView(startOfWeek);
  }

  function changeWeek(direction) {
    currentWeekStart.setDate(currentWeekStart.getDate() + (direction * 7));
    renderWeeklyView(document.getElementById('appContent'));
  }

  function loadTasksForWeeklyView(startDate) {
    if (!db) return;
    let weekDates = [];
    for (let i = 0; i < 7; i++) {
      let d = new Date(startDate);
      d.setDate(d.getDate() + i);
      weekDates.push(formatDateStr(d));
    }
    db.transaction(['tasks'], 'readonly').objectStore('tasks').getAll().onsuccess = (e) => {
      const allTasks = e.target.result;
      const grid = document.getElementById('weeklyGrid');
      if (!grid) return;
      let gridHtml = '';
      const dayNames = ['월', '화', '수', '목', '금', '토', '일'];
      weekDates.forEach((dateStr, index) => {
        const dayTasks = allTasks.filter(t => t.date === dateStr).sort((a, b) => (a.order || 0) - (b.order || 0));
        gridHtml += `
          <div class="week-day-card">
            <div class="week-day-header">${dayNames[index]}<br><span style="font-size:0.75em; color:#666;">${dateStr.slice(5)}</span></div>
            <div class="week-day-tasks">
        `;
        if (dayTasks.length === 0) gridHtml += `<div style="color:#aaa; text-align:center; margin-top:20px; font-size:0.8em;">없음</div>`;
        else {
          dayTasks.forEach(task => {
            gridHtml += `<div class="week-task-item ${task.completed ? 'done' : ''}" onclick="jumpToDate('${dateStr}')"><span>${task.completed ? '✔' : '•'}</span><span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(task.title)}</span></div>`;
          });
        }
        gridHtml += `</div></div>`;
      });
      grid.innerHTML = gridHtml;
    };
  }

  function renderMonthlyView(container) {
    const year = currentMonthDate.getFullYear();
    const month = currentMonthDate.getMonth();
    container.innerHTML = `
      <div class="header-controls">
        <button onclick="changeMonth(-1)">&lt; 이전</button>
        <span style="font-weight:bold; font-size: 1.1em;">${year}년 ${month + 1}월</span>
        <button onclick="changeMonth(1)">다음 &gt;</button>
      </div>
      <div class="calendar-grid" id="calendarGrid">
        <div class="calendar-weekday">월</div><div class="calendar-weekday">화</div><div class="calendar-weekday">수</div><div class="calendar-weekday">목</div><div class="calendar-weekday">금</div><div class="calendar-weekday">토</div><div class="calendar-weekday">일</div>
      </div>
    `;
    loadTasksForMonthlyView(year, month);
  }

  function changeMonth(direction) {
    currentMonthDate.setMonth(currentMonthDate.getMonth() + direction);
    renderMonthlyView(document.getElementById('appContent'));
  }

  function loadTasksForMonthlyView(year, month) {
    if (!db) return;
    const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
    const lastDate = new Date(year, month + 1, 0).getDate();
    db.transaction(['tasks'], 'readonly').objectStore('tasks').getAll().onsuccess = (e) => {
      const allTasks = e.target.result;
      const grid = document.getElementById('calendarGrid');
      if (!grid) return;
      let gridHtml = `<div class="calendar-weekday">월</div><div class="calendar-weekday">화</div><div class="calendar-weekday">수</div><div class="calendar-weekday">목</div><div class="calendar-weekday">금</div><div class="calendar-weekday">토</div><div class="calendar-weekday">일</div>`;
      for (let i = 0; i < firstDayIndex; i++) gridHtml += `<div class="calendar-cell empty"></div>`;
      for (let day = 1; day <= lastDate; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayTasks = allTasks.filter(t => t.date === dateStr).sort((a, b) => (a.order || 0) - (b.order || 0));
        gridHtml += `<div class="calendar-cell" onclick="jumpToDate('${dateStr}')"><div class="calendar-date-num">${day}</div><div class="calendar-tasks-preview">`;
        dayTasks.forEach(task => { gridHtml += `<div class="cal-task-badge ${task.completed ? 'done' : ''}">${escapeHtml(task.title)}</div>`; });
        gridHtml += `</div></div>`;
      }
      grid.innerHTML = gridHtml;
    };
  }

  function renderSettingsView(container) {
    container.innerHTML = `
      <h2>설정</h2>
      <div class="settings-card">
        ${!isUnlocked ? '<div class="locked-notice">🔒 우상단 연필 아이콘으로 잠금을 해제하세요.</div>' : ''}
        <label>비밀번호</label><input type="password" id="setPass" ${!isUnlocked ? 'disabled' : ''}>
        <label>Gemini API Key</label><input type="text" id="setGeminiKey" ${!isUnlocked ? 'disabled' : ''}>
        <label>EmailJS Service ID</label><input type="text" id="setEmailService" ${!isUnlocked ? 'disabled' : ''}>
        <label>EmailJS Template ID</label><input type="text" id="setEmailTemplate" ${!isUnlocked ? 'disabled' : ''}>
        <label>EmailJS Public Key</label><input type="text" id="setEmailPublic" ${!isUnlocked ? 'disabled' : ''}>
        <label>고지 대상 이메일</label><input type="email" id="setTargetEmail" ${!isUnlocked ? 'disabled' : ''}>
        ${isUnlocked ? '<button onclick="saveSettings()" style="width:100%; background:#007bff; color:white; border:none; padding:12px; border-radius:4px; margin-top:15px; font-weight:bold;">저장</button>' : ''}
      </div>
    `;
    loadSettingsIntoForm();
  }

  function loadSettingsIntoForm() {
    if (!db) return;
    db.transaction(['settings'], 'readonly').objectStore('settings').getAll().onsuccess = (e) => {
      e.target.result.forEach(item => {
        if (item.key === 'geminiKey') document.getElementById('setGeminiKey').value = item.value;
        if (item.key === 'emailService') document.getElementById('setEmailService').value = item.value;
        if (item.key === 'emailTemplate') document.getElementById('setEmailTemplate').value = item.value;
        if (item.key === 'emailPublic') document.getElementById('setEmailPublic').value = item.value;
        if (item.key === 'targetEmail') document.getElementById('setTargetEmail').value = item.value;
      });
    };
  }

  function saveSettings() {
    if (!isUnlocked) return;
    const pass = document.getElementById('setPass').value.trim();
    const geminiKey = document.getElementById('setGeminiKey').value.trim();
    const emailService = document.getElementById('setEmailService').value.trim();
    const emailTemplate = document.getElementById('setEmailTemplate').value.trim();
    const emailPublic = document.getElementById('setEmailPublic').value.trim();
    const targetEmail = document.getElementById('setTargetEmail').value.trim();

    const transaction = db.transaction(['settings'], 'readwrite');
    const store = transaction.objectStore('settings');
    if (pass) store.put({ key: 'password', value: pass });
    if (geminiKey) store.put({ key: 'geminiKey', value: geminiKey });
    if (emailService) store.put({ key: 'emailService', value: emailService });
    if (emailTemplate) store.put({ key: 'emailTemplate', value: emailTemplate });
    if (emailPublic) store.put({ key: 'emailPublic', value: emailPublic });
    if (targetEmail) store.put({ key: 'targetEmail', value: targetEmail });
    transaction.oncomplete = () => alert("저장 완료");
  }

  function jumpToDate(dateStr) { currentDate = dateStr; switchView('daily'); }
  function escapeHtml(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

  initDB();
</script>
</body>
</html>
